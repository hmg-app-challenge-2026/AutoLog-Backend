<!doctype html>
<!-- F-30 영수증 카메라 페이지. 로그인 없음, QR 1회 토큰(?t=)만 사용. 서버가 /r/{vehicleCode} 로 제공 -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoLog 영수증</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px 16px; text-align: center; }
    label { display: block; padding: 32px; border: 2px dashed #888; border-radius: 12px; font-size: 20px; }
    input { display: none; }
    #status { margin-top: 24px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>영수증 촬영</h1>
  <label>📷 눌러서 촬영<input id="file" type="file" accept="image/*" capture="environment" /></label>
  <div id="status"></div>
  <script>
    const code = location.pathname.split('/').filter(Boolean).pop();
    const token = new URLSearchParams(location.search).get('t');
    const status = document.getElementById('status');
    document.getElementById('file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = '전송 중…';
      const body = new FormData();
      body.append('image', file);
      try {
        const res = await fetch(`/r/${encodeURIComponent(code)}/receipt?t=${encodeURIComponent(token ?? '')}`, { method: 'POST', body });
        status.textContent = res.ok ? '차량으로 전송됨. 차 화면에서 확인하세요.'
          : res.status === 409 ? '이미 등록된 영수증입니다.'
          : '전송 실패. QR을 다시 찍어 주세요.';
      } catch {
        status.textContent = '네트워크 오류. 다시 시도해 주세요.';
      }
    });
  </script>
</body>
</html>
