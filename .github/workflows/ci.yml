name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: Unit tests
        run: ./gradlew test
      - name: Build
        run: ./gradlew :app:assembleDebug :relay:bootJar
